[tox]
env_list =
    py315
    py310
    lint
    format
    typecheck
minversion = 4.18.0

[testenv]
description = run the tests with pytest
package = wheel
wheel_build_env = .pkg
deps =
    pytest>=6
    pytest-sugar
commands =
    pytest {tty:--color=yes} -v {posargs}

[testenv:lint]
description = Lint using ruff
deps = ruff
commands = ruff check --fix

[testenv:typecheck]
description = Typecheck using ty
deps = ty
commands = ty check --fix

[testenv:format]
description = Format files using ruff
deps = ruff
commands = ruff format
